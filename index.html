<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCalc — Scientific Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>

    <main class="app">

        <!-- Calculator -->
        <section class="calculator">

            <!-- Header -->
            <header class="calculator-header">
                <div class="brand">
                    <div class="brand-icon">∑</div>

                    <div>
                        <h1>NovaCalc</h1>
                        <p>Scientific Calculator</p>
                    </div>
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    ONLINE
                </div>
            </header>


            <!-- Display -->
            <section class="display">

                <div class="display-top">
                    <span id="mode-label">DEG</span>

                    <span class="history-label">
                        <span id="history-count">0</span> calculations
                    </span>
                </div>

                <div id="operation" class="operation"></div>

                <div id="result" class="result">0</div>

            </section>


            <!-- Keypad -->
            <section class="keypad">

                <!-- Row 1 -->
                <button class="key mode-key active" id="deg">DEG</button>
                <button class="key mode-key" id="rad">RAD</button>
                <button class="key function" data-action="sqrt">√</button>
                <button class="key function" data-action="square">x²</button>
                <button class="key function" data-action="power">xʸ</button>
                <button class="key danger" data-action="clear">AC</button>


                <!-- Row 2 -->
                <button class="key function" data-value="(">(</button>
                <button class="key function" data-value=")">)</button>
                <button class="key function" data-value="π">π</button>
                <button class="key function" data-value="e">e</button>
                <button class="key function" data-action="factorial">x!</button>
                <button class="key danger-soft" data-action="delete">⌫</button>


                <!-- Row 3 -->
                <button class="key number" data-value="7">7</button>
                <button class="key number" data-value="8">8</button>
                <button class="key number" data-value="9">9</button>
                <button class="key operator" data-value="/">÷</button>
                <button class="key function small" data-action="sin">sin</button>
                <button class="key function small" data-action="asin">sin⁻¹</button>


                <!-- Row 4 -->
                <button class="key number" data-value="4">4</button>
                <button class="key number" data-value="5">5</button>
                <button class="key number" data-value="6">6</button>
                <button class="key operator" data-value="*">×</button>
                <button class="key function small" data-action="cos">cos</button>
                <button class="key function small" data-action="acos">cos⁻¹</button>


                <!-- Row 5 -->
                <button class="key number" data-value="1">1</button>
                <button class="key number" data-value="2">2</button>
                <button class="key number" data-value="3">3</button>
                <button class="key operator" data-value="-">−</button>
                <button class="key function small" data-action="tan">tan</button>
                <button class="key function small" data-action="atan">tan⁻¹</button>


                <!-- Row 6 -->
                <button class="key function" data-value="%">%</button>
                <button class="key number zero" data-value="0">0</button>
                <button class="key number" data-value=".">.</button>
                <button class="key operator" data-value="+">+</button>
                <button class="key function small" data-action="exp">exp</button>

                <button class="key equals" data-action="calculate">=</button>


                <!-- Row 7 -->
                <button class="key ans" data-action="ans">ANS</button>
                <button class="key function" data-action="negate">±</button>
                <button class="key function" data-action="history">HISTORY</button>

            </section>


            <!-- History -->
            <section id="history-panel" class="history-panel">

                <div class="history-header">
                    <h2>Calculation History</h2>
                    <button id="clear-history">Clear</button>
                </div>

                <div id="history-list" class="history-list">
                    <div class="empty-history">
                        No calculations yet
                    </div>
                </div>

            </section>

        </section>


        <!-- Footer -->
        <footer>
            <span>NovaCalc</span>
            <span>•</span>
            <span>Scientific Engine</span>
            <span>•</span>
            <span>Keyboard Ready</span>
        </footer>

    </main>


    <script src="calculator.js"></script>

</body>
</html>
